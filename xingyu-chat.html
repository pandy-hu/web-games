<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>星语小占 · 玄学娱乐助手</title>
<style>
  :root{
    --bg1:#1a1033; --bg2:#0e1430; --gold:#e8c97a; --pink:#e6a8d4; --text:#f3eefb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 20% -10%, #3a2466 0%, transparent 60%),
      radial-gradient(1000px 500px at 90% 0%, #2a3a7a 0%, transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height:100vh;
    background-attachment:fixed;
  }
  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff 50%, transparent),
      radial-gradient(1px 1px at 30% 70%, #fff 50%, transparent),
      radial-gradient(1.5px 1.5px at 70% 40%, #ffe 50%, transparent),
      radial-gradient(1px 1px at 85% 80%, #fff 50%, transparent),
      radial-gradient(1px 1px at 50% 15%, #fff 50%, transparent);
  }
  .wrap{position:relative; z-index:1; max-width:720px; margin:0 auto; padding:18px 14px 28px;}
  header{text-align:center; padding:10px 0 4px;}
  .logo{font-size:30px;}
  h1{font-size:22px; margin:6px 0 2px; letter-spacing:1px;}
  .sub{font-size:13px; color:#cdbdf0; margin:0;}
  .disclaimer{
    margin:14px 0; padding:10px 14px; border-radius:12px;
    background:rgba(232,201,122,.12); border:1px solid rgba(232,201,122,.4);
    color:var(--gold); font-size:13px; text-align:center; line-height:1.6;
  }
  .login-tip{
    margin:10px 0; padding:8px 12px; border-radius:10px;
    background:rgba(150,180,255,.08); border:1px solid rgba(150,180,255,.3);
    color:#b6c7f5; font-size:12px; text-align:center; line-height:1.6;
  }
  .panel{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:16px; padding:10px; backdrop-filter:blur(6px);
  }
  /* iframe 必须给明确高度 */
  #chatbot-iframe{
    width:100%; height:70vh; min-height:520px;
    border:0; border-radius:12px; background:#fff; display:block;
  }
  .toolbar{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    margin-top:12px;
  }
  .btn{
    display:inline-block; padding:9px 16px; border-radius:10px; font-size:13px;
    text-decoration:none; color:var(--bg2); background:var(--gold);
    border:1px solid var(--gold); transition:.2s;
  }
  .btn:hover{background:#f5d893;border-color:#f5d893;}
  .btn.alt{background:transparent;color:var(--gold);}
  .btn.alt:hover{background:rgba(232,201,122,.12);}
  .tip{font-size:12px; color:#b9a9e0; text-align:center; margin-top:12px; line-height:1.7;}
  footer{text-align:center; font-size:11px; color:#8e80b8; margin-top:14px; line-height:1.7;}
  a{color:var(--gold);}
  @media(max-width:480px){
    #chatbot-iframe{height:75vh; min-height:480px;}
  }
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">
  <header>
    <div class="logo">🔮✨</div>
    <h1>星语小占</h1>
    <p class="sub">玄学娱乐 · 自我探索小助手</p>
  </header>

  <div class="disclaimer">
    🌟 仅供娱乐，理性看待，切勿当真。<br>
    本页内容由 AI 生成，仅供娱乐与自我探索参考，不构成任何人生、投资、医疗或婚恋决策建议。
  </div>

  <div class="login-tip">
    💡 首次打开会跳到扣子登录页；登录后此页面会自动记住你，刷新即可直接对话。
  </div>

  <div class="panel">
    <!-- iframe 方式：直接嵌入 Coze 官方 bot 页面，最稳，不依赖任何 SDK -->
    <iframe
      id="chatbot-iframe"
      src="https://www.coze.cn/store/bot/7666428443529756735"
      allow="microphone; camera; clipboard-read; clipboard-write"
      referrerpolicy="no-referrer-when-downgrade"
      loading="lazy"
      title="星语小占">
    </iframe>
  </div>

  <div class="toolbar">
    <a class="btn" href="https://www.coze.cn/store/bot/7666428443529756735" target="_blank" rel="noopener">
      🚀 在扣子中打开（备用入口）
    </a>
    <a class="btn alt" href="javascript:location.reload()">
      ↻ 刷新页面
    </a>
  </div>

  <p class="tip">和星语小占聊聊星座、MBTI、九型或今天的心情吧～<br>它只陪你认识自己，绝不替你算命或做决定。</p>

  <footer>
    🌟 仅供娱乐，理性看待，切勿当真。Powered by 扣子 Coze。<br>
    不提供任何形式的付费算命 / 改运 / 消灾 / 转运服务。
  </footer>
</div>
</body>
</html>
